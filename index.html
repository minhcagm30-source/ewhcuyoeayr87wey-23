    --border: #F5C6D6; --text: #4A2C3A; --muted: #9B6B7D;
    --accent: #E891B0; --accent2: #F0A8C0; --dark-accent: #D9789C;
    --header-bg: #FFE4EE; --header-bg2: #FFD6E7;
    --hero-bg: #FFE4EE; --hero-bg-end: #FFF0F5; --hero-text: #4A2C3A; --hero-sub: #9B6B7D;
    --input-bg: #FFFFFF; --danger: #D6455D; --success: #4CAF6E;

  }

    --border: #5A4A6A; --text: #FFFFFF; --muted: #D4CBE0;
    --accent: #E85F75; --accent2: #D6455D; --dark-accent: #F08A7E;
    --header-bg: #1A1520; --header-bg2: #2D2338;
    --hero-bg: #141018; --hero-bg-end: #1A0A14; --hero-text: #FFFFFF; --hero-sub: #F0C8D0;
    --input-bg: #1D1724; --danger: #E85F75; --success: #5CD67A;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  .hidden { display: none !important; }
  #header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(90deg, var(--header-bg), var(--header-bg2));
    border-bottom: 1px solid var(--border);
    padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .logo-box {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 20px;

  .brand { font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .nav-btn {
    background: transparent; border: none; color: var(--text);
    padding: 7px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .nav-btn:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
  }
  .av {
    width: 28px; height: 28px; border-radius: 50%; background: var(--panel);
    border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .rank-badge {
    font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px;
    background: var(--accent); color: #fff;
  }
  .rank-badge.O { background: linear-gradient(135deg,#FFD700,#FF8C00); color:#1a1a1a; }
  .rank-badge.O2 { background: linear-gradient(135deg,#C0C0C0,#8B8B8B); color:#111; }
  .rank-badge.A { background: #7C4DFF; }
  .rank-badge.B { background: #2196F3; }
  .rank-badge.C { background: #4CAF50; }
  .rank-badge.D { background: #78909C; }
  .rank-badge.E { background: #9E9E9E; }
  .btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 14px; cursor: pointer; font-size: 12px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.08); color: #fff; }
  .btn-danger { background: color-mix(in srgb, var(--danger) 15%, var(--panel)); color: var(--danger); border-color: var(--danger); }
  #app { min-height: calc(100vh - 56px); }
  .page { padding: 20px 16px 40px; max-width: 1100px; margin: 0 auto; }
  .hero {
    background: linear-gradient(135deg, var(--hero-bg), var(--hero-bg-end));
    border-radius: 20px; padding: 28px 24px; margin-bottom: 24px;
    border: 1px solid var(--border);
  }
  .hero-badge { color: var(--accent); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .hero h1 { font-size: 26px; color: var(--hero-text); white-space: pre-line; margin-bottom: 8px; }
  .hero p { color: var(--hero-sub); font-size: 14px; margin-bottom: 16px; }
  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 15px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: ""; width: 4px; height: 18px; background: var(--section-bar); border-radius: 2px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; transition: .15s; box-shadow: var(--shadow);
  }
  .card:hover { background: var(--card-hover); transform: translateY(-2px); border-color: var(--accent); }
  .card-cover {
    aspect-ratio: 3/4; background: linear-gradient(160deg, var(--panel), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 36px; color: #fff;
    position: relative;
  }
  .badge-ex {
    position: absolute; top: 6px; left: 6px; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
  }
  .badge-drive {
    position: absolute; top: 6px; right: 6px; background: #4285F4; color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
  }
  .card-body { padding: 8px 10px 10px; }
  .card-title { font-size: 12px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .form-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; max-width: 420px; margin: 40px auto; box-shadow: var(--shadow);
  }
  .form-card h2 { text-align: center; margin-bottom: 6px; font-size: 20px; }
  .form-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--input-bg); outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 100px; resize: vertical; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 8px; border-radius: 10px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); font-size: 13px; font-weight: 600;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .msg { font-size: 13px; margin-top: 10px; text-align: center; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--success); }
  #splash {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;

  }
  #splash .big { font-size: 48px; margin-bottom: 8px; }
  #splash h1 { font-size: 28px; margin-bottom: 6px; }
  #splash p { color: var(--muted); margin-bottom: 24px; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: var(--card); border-radius: 18px; border: 1px solid var(--border);

  .modal h2 { margin-bottom: 8px; }
  .modal .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .chapter-list { list-style: none; margin-top: 12px; }
  .chapter-list li {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center;

  .chapter-list li:hover { background: var(--card-hover); border-color: var(--accent); }
  .post, .msg-bubble {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .post .author { font-weight: 700; font-size: 13px; }
  .post .time, .msg-bubble .time { font-size: 11px; color: var(--muted); }
  .chat-box { max-height: 360px; overflow-y: auto; margin-bottom: 12px; }
  .msg-bubble.me { background: color-mix(in srgb, var(--accent) 20%, var(--card)); margin-left: 20%; }
  .msg-bubble.them { margin-right: 20%; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input { flex: 1; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); }
  .reader-body {
    margin-top: 12px; padding: 14px; background: var(--panel); border-radius: 12px;
    white-space: pre-wrap; font-size: 15px; line-height: 1.65; max-height: 50vh; overflow: auto;
  }
  .tip { font-size: 12px; color: var(--muted); margin-top: 8px; }
  @media (max-width: 600px) {
    .hero h1 { font-size: 22px; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .nav-btn { padding: 6px 8px; font-size: 12px; }
  }
</style>
</head>

{id:4,title:"Tôi chỉ đang tận hưởng hạnh phúc trong cuộc đời",author:"Nguyên Thủy Lọ Tôn",author_id:1,genre:"Biến Đơn",views:110000005,monthly:110000005,exclusive:false,potential:false,status:"published",drive_file_id:"1uU3eVrtXoG0xRfqn_-b-zaqdwBzxYL3S",chapters:[{n:1,t:"Chương 1",body:"Đêm mà tôi kiểm tra thư trúng tuyển từ Đại học Hàn Quốc danh giá, nổi tiếng cả trong nước lẫn quốc tế.\n\nCảm giác có gì đó rất lạ vào đêm ấy.\n\n‘Mình đang ở đâu thế này?’\n\nKhung cảnh hoàn toàn khác biệt so với căn phòng bệnh viện mà tôi đã gắn bó suốt cả cuộc đời.\n\nTôi nhìn thấy một chiếc đèn chùm vàng và những bức tường lát đá cẩm thạch màu ngà.\n\nMùi hương hoa thoang thoảng hoàn toàn khác với mùi bệnh viện mà tôi đã quen thuộc.\n\n‘Các bác sĩ đâu rồi? Các y tá đâu?’   \n\nguufigoiynib98\n\nXin lỗi?\n\nTôi cố lên tiếng, nhưng…\n\n“Òa òa!”\n\nTiếng khóc bật ra.\n\n‘Gì đây, chuyện quái gì thế này? Đây là trò đùa à?’\n\nTôi chớp mắt.\n\nCơ thể tôi không thể cử động như ý muốn.\n\nRên rỉ, rên rỉ.\n\nTôi cố gắng nâng tay lên. Nhưng cánh tay của tôi rất ngắn.\n\n“Òa òa!”\n\nGiọng nói của tôi cứ bật ra không theo ý mình, và tôi chỉ vừa kịp quay đầu để nhìn cánh tay ngắn, mũm mĩm của mình.\n\nNó trông giống như một chiếc xúc xích nhỏ bé.\n\nMột giọng nói vang lên.\n\n“Là một bé gái!”\n\nTôi khá sốc.\n\nNgôn ngữ đó không phải tiếng Hàn.\n\nNhưng tôi tự động hiểu nó như thể đó là ngôn ngữ mẹ đẻ của mình.\n\n“Công chúa đã chào đời!”\n\nWow, tôi nghĩ mình đã chuyển sinh sang một thế giới khác.\n\n‘Hoặc có thể mình đã nhập hồn?’\n\nTôi lắng nghe lời của bà đỡ.\n\nNhưng sau đó, tôi nghe thấy tiếng ai đó khóc nức nở.\n\n“Một bé gái được sinh ra trong Hoàng gia Bilotian…”\n\nTôi không chắc lắm, nhưng dường như mẹ tôi - người đã sinh ra tôi - đang khóc.\n\nBà không hề tỏ vẻ vui mừng khi sinh ra tôi.\n\nNhưng tôi thì khá vui vẻ.\n\n‘Ồ! Bilotian! Mình biết cái này.’\n\nBilotian là tên của hoàng gia trong cuốn tiểu thuyết ‘Sau Cái Chết của Ác Nữ’.\n\nGia tộc này có một truyền thống đặc biệt là chỉ coi trọng sức mạnh, tin rằng chỉ có quyền lực mới chứng minh được giá trị của một con người.\n\nĐây là một dòng máu tàn nhẫn, xem con cái không phải là những đứa trẻ mà là những người kế thừa tiềm năng, và suốt 500 năm qua chỉ sinh ra con trai.\n\n‘Đây là nơi Công chúa Isabel được sinh ra. Vậy, chắc đó là mình?’\n\nKiếm pháp của gia tộc Bilotian được thiết kế và phát triển phù hợp với mạch ma thuật của đàn ông.\n\nNói cách khác, phụ nữ không thể học kiếm pháp Bilotian.\n\nSinh ra là một bé gái trong gia tộc Bilotian, nơi coi trọng sức mạnh hơn hết, là một lời nguyền.\n\n‘Một bà đỡ đang hoang mang, một người mẹ khóc nức nở. Gia đình Hoàng gia Bilotian. Công chúa đầu tiên được sinh ra sau 500 năm. Tên của mình là Isabel?’\n\nKhông còn nghi ngờ gì nữa, tôi đã tỉnh dậy trong cuốn tiểu thuyết ‘Sau Cái Chết của Ác Nữ’.\n\nTôi đã đọc nó hơn 17 lần.\n\nTôi gần như biết hết tất cả các nhân vật và đã thuộc lòng bối cảnh cũng như cốt truyện.\n\nTôi đã nằm liệt giường trong suốt cuộc đời mình, và sở thích duy nhất của tôi là giải toán và đọc tiểu thuyết.\n\n‘Wow, đây chắc chắn là nhập hồn rồi.’\n\nThành thật mà nói, tin rằng đây là một giấc mơ thì có vẻ hợp lý hơn, nhưng vì tôi thích ý tưởng nhập hồn hơn, nên tôi quyết định nghĩ theo hướng đó.\n\n“Òa òa!”\n\nDù đang khóc, tôi vẫn cảm thấy vui.\n\nTôi không nói dối đâu; tôi thực sự rất hài lòng với việc nhập hồn này.\n\n‘Nơi này tốt hơn Hàn Quốc nhiều.’\n\nỞ Hàn Quốc, tôi là một đứa trẻ mồ côi.\n\nCha ruột của tôi bỏ trốn trước khi tôi được sinh ra, và mẹ tôi cũng bỏ rơi tôi không lâu sau đó.\n\nTôi không biết mặt mũi của họ trông như thế nào.\n\nLên 4 tuổi, tôi được chẩn đoán mắc bệnh ung thư ở trẻ em và bắt đầu cuộc chiến với căn bệnh này.\n\nTôi thường được giới thiệu trên các phương tiện truyền thông như một đứa trẻ bất hạnh.\n\nNhờ sự hỗ trợ của nhiều người xa lạ, tôi đã có thể ở lại bệnh viện và kiên trì đến tận bây giờ.\n\nMay mắn thay, tôi có năng khiếu trong việc học tập.\n\n[Một kỳ tích đạt được từ giường bệnh!]\n\n[Đứa trẻ kỳ diệu được nhận vào Đại học Hàn Quốc.]\n\nViệc tôi được nhận vào trường đại học thậm chí còn được phát sóng trên bản tin.\n\nNhiều người đã chúc mừng và ca ngợi tôi.\n\nTôi rất biết ơn, nhưng thực sự, tôi không cảm thấy hạnh phúc lắm.\n\n‘Dù sao thì mình cũng sắp chết rồi.’\n\nTôi chắc chắn về cái chết sắp tới của mình.\n\nTrong khi đó, mọi thứ đều quá đau đớn và khó khăn.\n\nTôi thường mong muốn mình có thể chết nhanh để được giải thoát.\n\n‘Wow, mọi người, cơ thể tui không hề đau chút nào luôn!’\n\nDù tôi đang khóc to, nhưng tôi không cảm thấy đau đớn gì cả.\n\nLẽ ra tôi phải cảm nhận được cơn đau đè nén trong lồng ngực.\n\nChỉ riêng điều đó thôi cũng khiến tôi cảm thấy rất vui.\n\n‘Nếu mình xuyên vào Isabel, thì mình sẽ chết ở tuổi 21 à?’\n\nIsabel sinh ra đã mắc bệnh nan y.\n\nCô ấy có “Dấu ấn Narvidal”, một chi tiết trong tiểu thuyết.\n\nDấu ấn Narvidal là một biểu tượng hình chiếc đồng hồ cát được in hằn trên cổ tay của cô.\n\nTrong suốt cuộc đời, những hạt cát nhỏ sẽ liên tục rơi xuống, và khi cát cạn kiệt, cô sẽ chết.\n\nĐó là một lời nguyền mà cô ấy mang từ khi sinh ra.\n\nNhưng dù sao đi nữa, tôi không cảm thấy đau đớn gì ngay lúc này.\n\nÍt nhất là cho đến khi tôi 21 tuổi, tôi có thể sống một cách khỏe mạnh và hạnh phúc.\n\nTôi đã có thêm 21 năm cuộc đời, trong khi lẽ ra tôi có thể chết bất cứ lúc nào.\n\n‘Thật là một món hời!’\n\nDù mắc bệnh nan y, tôi đã xuyên vào một Isabel rất khỏe mạnh và xinh xắn.\n\n‘Wow, vậy là bây giờ mình có thể thoải mái ăn bánh quy à?’\n\nCả đời tôi chỉ ăn thức ăn bệnh viện.\n\nTôi thậm chí chưa bao giờ được uống cola.\n\nCó lần tôi nhấp một ngụm nhỏ, và y tá đã mắng tôi rất dữ.\n\n‘Liệu ở thế giới này có cola không nhỉ?’\n\nMột cách vô tình, tôi đã trở nên nghiêm túc về vấn đề đồ ăn.\n\n‘Ở đây chắc không có tokbokki, đúng không ta?’\n\nĐó là món ăn Hàn Quốc, nên có lẽ không tồn tại ở đây.\n\nTôi biết công thức, nhưng trong hoàn cảnh này, sao tôi lại nghĩ đến tokbokki nhỉ?\n\n… Dù nghĩ vậy, dòng suy nghĩ vẫn không ngừng.\n\n‘Liệu mình có thể thử uống rượu trước khi chết không nhỉ?’\n\nChắc hẳn nó ngon lắm nên người ta mới nghiện đến vậy.\n\nNgười ta nói nó đắng, nhưng có lẽ đó chỉ là một lời nói dối để ngăn trẻ con uống mà thôi.\n\nTôi thực sự muốn thử một lần trước khi chết.\n\nKiểu như một thứ gì đó dành cho người lớn, nhâm nhi một ly rượu vang trong khi tận hưởng cảnh đêm tuyệt đẹp.\n\nNó chỉ là một ảo tưởng, nhưng nếu có một điều ước, thì đó sẽ là điều tôi muốn.\n\n“Òa òa!”\n\nDù tôi hét lớn, nhưng tất cả những gì phát ra từ miệng chỉ là “Òa òa!”\n\nMột giọng nói khác vang lên.\n\n“Một thứ vô dụng đã được sinh ra.”\n\nĐúng như trong tiểu thuyết.\n\n「“Một thứ vô dụng đã được sinh ra.”」\n\n「Anh nhìn cô bé mới chào đời bằng ánh mắt vô cảm. Không hề có một chút tình cảm cha con nào trong ánh nhìn ấy.」\n\nTôi đảo mắt để nhìn gương mặt vừa xuất hiện.\n\nVà theo bản năng, tôi bật khóc.\n\n“Òa òa (đẹp trai quá)!”\n\nThành thật mà nói, tôi thực sự rất bất ngờ.\n\nTôi chưa từng thấy ai đẹp trai đến thế trong đời.\n\nMô tả trong tiểu thuyết thật sự rất chính xác.\n\n「Mọi người đều không ngần ngại gọi anh ta là một vẻ đẹp hoàn hảo. Mặc dù bị gọi là con búp bê vô cảm, nhưng rất nhiều quý cô vẫn thầm thương trộm nhớ anh.」\n\nMái tóc đen ngắn, lông mày và đôi mắt sắc sảo.\n\nÁnh mắt của ông ấy vô cùng dữ dội.\n\nDù vậy, ông ấy vẫn đẹp đến mức tôi không thể rời mắt. Người đàn ông này chắc chắn là cha tôi, Ron.\n\n‘Hihi.’\n\nNgay khi nhìn thấy gương mặt đẹp đẽ ấy, tôi đã tự trách mình vì trí tưởng tượng quá nghèo nàn.\n\n‘Ông ấy đẹp trai hơn cả trong tưởng tượng của mình.’\n\nÔng ấy đẹp đến mức khiến tôi ngừng khóc, dù đang là một đứa trẻ sơ sinh.\n\n‘Wow, ánh mắt dữ dội, nhưng ngay cả thế cũng rất đẹp.’\n\nThái độ của ông ấy đối với tôi hoàn toàn tự nhiên trong thế giới này.\n\nRon rất yêu vợ mình nhưng chưa bao giờ xem con cái như những đứa trẻ đúng nghĩa.\n\nTôi không cảm thấy quá sợ hãi.\n\nTrong tiểu thuyết, Isabel - người mắc bệnh nan y - đã trưởng thành trở thành một ác nữ vĩ đại.\n\n‘Cô ấy gây ra mọi tội ác có thể tưởng tượng và chết tự nhiên ở tuổi 21.’\n\nHơn nữa, vào ngày tôi chết, gia đình hoàng tộc sắt máu cũng sụp đổ.\n\nNam chính - người mà tôi đã hành hạ không thương tiếc khi còn nhỏ - trở lại sau khi thức tỉnh và tiêu diệt gia tộc Bilotian.\n\nĐó là lý do cuốn sách có tên ‘Sau Cái Chết của Ác Nữ’.\n\n‘Dù sao, điều đó có nghĩa là dù tôi làm gì, gia đình hoàng tộc cũng sẽ không động đến tôi!’\n\nVì vậy, không cần phải sợ.\n\nCha tôi quay lưng lại.\n\nÔng ấy thậm chí không dành một ánh nhìn âu yếm nào cho tôi.\n\nĐiều đó có chút buồn, nhưng với tư cách là một độc giả đã đọc cuốn tiểu thuyết nhiều lần, tôi hiểu đây là một phản ứng hợp lý.\n\n‘Vậy, mình đoán bây giờ mình sẽ được chẩn đoán mắc bệnh nan y.’\n\nNgay lúc đó, bà đỡ nhận ra điều gì đó trên cổ tay tôi và lên tiếng.\n\n“Bệ hạ! Đây là Dấu ấn Narvidal.”\n\nNhững đứa trẻ sinh ra với dấu ấn này sẽ chết ở tuổi 21.\n\n‘Vậy giờ cha mình sẽ mất hứng thú và rời đi, đúng không?’\n\nMột câu trả lời lạnh lùng vang lên.\n\n“Ta không quan tâm.”\n\nRầm.\n\nTôi nghe thấy tiếng cửa đóng.\n\nTôi không cảm thấy tệ chút nào.\n\n‘21 năm.’\n\nTôi đã được tặng miễn phí 21 năm cuộc đời.\n\nTiếng khóc của mẹ tôi vẫn tiếp tục.\n\n“Con của mẹ…”\n\nMẹ sẽ xin lỗi tôi.\n\nMẹ sẽ nói rằng mẹ rất xin lỗi vì đã sinh ra tôi.\n\n“Mẹ xin lỗi vì đã sinh con ra.”\n\n“Òa òa!”\n\nKhông, thực sự tôi hoàn toàn ổn mà.\n\nTôi muốn nói vậy, nhưng không thể cất thành lời.\n\nTôi quyết định sẽ nói điều đó khi tôi có thể nói được.\n\n‘Dù mình không thể học kiếm pháp.’\n\nNhưng tôi thực sự rất thông minh.\n\nVà tôi biết rất rõ về tương lai. Tôi thậm chí biết những nhân vật mạnh mẽ nhất trong thế giới này.\n\n‘Thế giới này thậm chí có thứ gì đó giống tiền điện tử.’\n\nNó được gọi khác đi, nhưng có thứ gì đó giống như tiền xu ở đây.\n\nTrong khoảng mười năm nữa, giá trị của nó sẽ tăng lên hàng trăm ngàn lần.\n\nHơn nữa, tôi biết khá rõ về Narmore, người tạo ra loại tiền này, cũng như các phù thủy, kỹ sư ma thuật và doanh nhân đầy /* ===== Drive helpers (cùng logic extract ID như app) ===== */
function extractDriveFileId(urlOrId) {
  const s = String(urlOrId||"").trim();
  if (!s) return "";
  let m = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{20,}$/.test(s)) return s;
  return "";
}
function driveViewUrl(fidOrUrl) {
  const fid = extractDriveFileId(fidOrUrl);
  if (!fid) return String(fidOrUrl||"");
  return "https://drive.google.com/file/d/"+fid+"/view";
}
function driveDownloadUrl(fidOrUrl) {
  const fid = extractDriveFileId(fidOrUrl);
  if (!fid) return "";
  return "https://drive.google.com/uc?export=download&id="+fid;
}
function drivePreviewUrl(fidOrUrl) {
  const fid = extractDriveFileId(fidOrUrl);
  if (!fid) return "";

}
/** Thử tải text public (thường bị CORS trên web — fallback mở tab). */
async function tryFetchDriveText(fidOrUrl) {
  const fid = extractDriveFileId(fidOrUrl);
  if (!fid) throw new Error("Không tìm thấy File ID trong link Drive.");
  const urls = [
    "https://drive.usercontent.google.com/download?id="+fid+"&export=download&confirm=t",
    "https://drive.google.com/uc?export=download&id="+fid,
  ];
  let lastErr = null;
  for (const url of urls) {
    try {
      const resp = await fetch(url, { mode: "cors", credentials: "omit" });
      if (!resp.ok) { lastErr = new Error("HTTP "+resp.status); continue; }
      const buf = await resp.arrayBuffer();
      const head = new TextDecoder("utf-8", {fatal:false}).decode(buf.slice(0, 200)).toLowerCase();
      if (head.includes("<!doctype") || head.includes("<html")) {
        lastErr = new Error("Drive trả HTML (cần mở link public).");
        continue;
      }
      return new TextDecoder("utf-8", {fatal:false}).decode(buf);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error("Không tải được (CORS). Dùng «Mở trên Drive».");
}
const CHAPTER_HEADER_RE = /(?:^|\n)(?:#{1,3}\s*)?(?:Chương|CHƯƠNG|Chuong|Chapter|CHAPTER|Phần|PHẦN)\s*(\d+)(?:\s*[:.\-–—]\s*|\s+)([^\n]{0,120})?/gi;
function parseChaptersFromText(text) {
  text = String(text||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  if (!text.trim()) return [];
  const matches = [];
  let m;
  const re = new RegExp(CHAPTER_HEADER_RE.source, "gi");
  while ((m = re.exec(text)) !== null) {
    matches.push({ index: m.index, num: +m[1], sub: (m[2]||"").trim(), endHeader: m.index + m[0].length });
  }
  const chapters = [];
  if (matches.length) {
    const pre = text.slice(0, matches[0].index).trim();
    if (pre.length > 80) chapters.push({ n: 0, t: "Mở đầu", body: pre });
    for (let i = 0; i < matches.length; i++) {
      const cur = matches[i];
      const end = i + 1 < matches.length ? matches[i+1].index : text.length;
      const body = text.slice(cur.endHeader, end).trim();
      const title = "Chương " + cur.num + (cur.sub ? ": " + cur.sub : "");
      chapters.push({ n: cur.num, t: title, body });
    }
  } else {
    chapters.push({ n: 1, t: "Chương 1", body: text.trim() });
  }
  return chapters.filter(c => (c.body||"").trim()).map((c,i) => ({ ...c, n: c.n || (i+1) }));
}

function activateKey(email, key, displayName, password) {
  email = (email||"").trim().toLowerCase();

  let users = LS.get("users",[]);
  let u = users.find(x => x.email === email);
  if (!u) {
    u = { id: users.length ? Math.max(...users.map(x=>x.id))+1 : 1, email, display_name: displayName || email.split("@")[0], rank: "D", password, active:true, bio:"" };
    users.push(u);

  return { ok:true, user:{ ...u }, msg:"Kích hoạt thành công." };

    genres: ui("nav_genres"), forum: ui("nav_forum"), chat: ui("nav_chat"),

    admin: "Quản trị",

  // Admin: chèn Đăng Drive + Quản trị trước Tài khoản
  let keys = order.filter(k => k !== "publish_drive" && k !== "admin");
  if (canAdminWeb(state.user)) {
    const ai = keys.indexOf("account");
    const insert = ["publish_drive", "admin"];
    if (ai >= 0) keys.splice(ai, 0, ...insert);
    else keys.push(...insert);
  }
  keys.forEach(k => {
    if (!labels[k]) return;
    if (k === "forum" && state.user && !canForum(state.user) && !state.user.id) return;
    if (k === "chat" && (!state.user || !canChat(state.user))) return;
    if ((k === "forum" || k === "chat") && !state.user) return;
    if (k === "publish_drive" && !canPublishDrive(state.user)) return;
    if (k === "admin" && !canAdminWeb(state.user)) return;
    const b = document.createElement("button");
    b.className = "nav-btn" + (state.page === k ? " active" : "");
    b.textContent = labels[k];
    b.onclick = () => goto(k);
    nav.appendChild(b);

  if (state.page === "collections") return renderCollections(el);
  if (state.page === "genres") return renderGenres(el);
  if (state.page === "forum") return renderForum(el);
  if (state.page === "chat") return renderChat(el);
  if (state.page === "publish_drive") return renderPublishDrive(el);
  if (state.page === "admin") return renderAdminWeb(el);
  if (state.page === "account") return renderAccount(el);
  renderHome(el);
}

function esc(s) {
  return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function timeAgo(ts) {
  const d = Math.floor((Date.now()-ts)/1000);
  if (d<60) return "vừa xong";
  if (d<3600) return Math.floor(d/60)+" phút trước";
  if (d<86400) return Math.floor(d/3600)+" giờ trước";
  return Math.floor(d/86400)+" ngày trước";
}

function storyCard(s) {

      <div class="card-meta">${esc(s.author||"")} · ${formatViews(s.views)} views</div>

}

            <tr style="color:var(--muted)"><th style="text-align:left;padding:8px;border-bottom:1px solid var(--border)">Key</th>
              <th style="text-align:left;padding:8px;border-bottom:1px solid var(--border)">Used</th>
              <th style="padding:8px;border-bottom:1px solid var(--border)"></th></tr>
            ${keys.map(k => `<tr>
              <td style="padding:8px;border-bottom:1px solid var(--border);font-family:monospace;font-size:11px">${k.revoked?"(revoked) ":""}${esc(k.plain)}${k.note?`<div style="color:var(--muted);font-size:11px">${esc(k.note)}</div>`:""}</td>
              <td style="padding:8px;border-bottom:1px solid var(--border)">${esc(k.used_by||"—")}</td>
              <td style="padding:8px;border-bottom:1px solid var(--border)">${!k.revoked?`<button class="btn btn-danger" data-rev="${k.id}" style="font-size:11px;padding:2px 8px">Thu hồi</button>`:""}</td>
            </tr>`).join("") || `<tr><td colspan="3" class="empty">Chưa có key</td></tr>`}
          </table>
        </div>
      </div>
    </div>`;
  el.querySelector("#btn-gen-key").onclick = () => {
    const note = el.querySelector("#key-note")?.value || "";
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const parts = () => Array.from({length:4}, () => alphabet[Math.floor(Math.random()*alphabet.length)]).join("");
    const plain = "EMAF-"+parts()+"-"+parts()+"-"+parts();
    const keys = LS.get("keys", []);
    keys.unshift({ id: Date.now(), plain, note, used_by: null, revoked: false, created: Date.now() });
    LS.set("keys", keys);
    try { navigator.clipboard.writeText(plain); } catch (_) {}
    alert("Key mới (đã copy clipboard nếu được):\n"+plain);
    renderAdminWeb(document.getElementById("app"));
  };
  el.querySelectorAll("[data-rev]").forEach(b => {
    b.onclick = () => {
      const keys = LS.get("keys", []);
      const k = keys.find(x => x.id === +b.dataset.rev);
      if (k) k.revoked = true;
      LS.set("keys", keys);
      renderAdminWeb(document.getElementById("app"));
    };
  });
}

      <p class="tip" style="margin-bottom:14px">

        (file .txt / .epub). Giống app: lưu <code>drive_file_id</code> + mục lục nếu tải được.

        <div class="field"><label>Link Google Drive (hoặc File ID)</label>
          <input id="pd-link" placeholder="https://drive.google.com/file/d/..../view" /></div>
        <div class="field"><label>Tiêu đề (để trống = lấy từ file nếu tách được)</label>
          <input id="pd-title" placeholder="Tên truyện" /></div>
        <div class="field"><label>Thể loại</label>
          <select id="pd-genre">${DEMO_GENRES.map(g=>`<option>${esc(g)}</option>`).join("")}</select></div>
        <div class="field"><label>Tác giả hiển thị</label>
          <input id="pd-author" value="${esc(state.user.display_name||state.user.email)}" /></div>

          <button class="btn btn-primary" id="btn-pd-pub">Đăng tải</button>
          <button class="btn" id="btn-pd-preview">Thử tải / xem trước mục lục</button>
        </div>
        <p class="msg" id="pd-msg"></p>
        <pre id="pd-preview" class="reader-body" style="display:none;max-height:200px;font-size:12px"></pre>

    </div>`;
  bindStoryCards(el.querySelector("#pd-mine"));
  const msg = el.querySelector("#pd-msg");
  const prev = el.querySelector("#pd-preview");

  el.querySelector("#btn-pd-preview").onclick = async () => {
    const link = el.querySelector("#pd-link").value.trim();
    const fid = extractDriveFileId(link);
    if (!fid) { msg.className="msg err"; msg.textContent="Link/ID Drive không hợp lệ."; return; }
    msg.className="msg"; msg.textContent="Đang thử tải (có thể bị CORS)…";
    prev.style.display="block";
    try {
      const text = await tryFetchDriveText(fid);
      const chs = parseChaptersFromText(text);
      prev.textContent = chs.length
        ? ("Tách được "+chs.length+" chương:\n"+chs.slice(0,15).map(c=>c.n+". "+c.t).join("\n")+(chs.length>15?"\n…":""))
        : text.slice(0,1500);
      msg.className="msg ok"; msg.textContent="Tải OK — có thể bấm Đăng tải.";
      el._pdCache = { fid, text, chs };
    } catch (e) {
      el._pdCache = { fid, text:"", chs:[] };
      prev.textContent = "Không tải trong trình duyệt (CORS). Vẫn có thể Đăng tải — chỉ lưu link Drive; độc giả bấm «Mở trên Drive».";
      msg.className="msg err"; msg.textContent=(e&&e.message)||String(e);
    }
  };

  el.querySelector("#btn-pd-pub").onclick = async () => {
    const link = el.querySelector("#pd-link").value.trim();
    const fid = extractDriveFileId(link);
    if (!fid) { msg.className="msg err"; msg.textContent="Cần link Drive hợp lệ."; return; }
    let title = el.querySelector("#pd-title").value.trim();
    const genre = el.querySelector("#pd-genre").value;
    const author = el.querySelector("#pd-author").value.trim() || state.user.display_name || state.user.email;
    let chs = (el._pdCache && el._pdCache.fid===fid) ? el._pdCache.chs : [];
    if (!chs.length) {
      try {
        msg.textContent="Đang tải để tách chương…";
        const text = await tryFetchDriveText(fid);
        chs = parseChaptersFromText(text);
        el._pdCache = { fid, text, chs };
      } catch (_) {
        chs = [{ n:1, t:"Chương 1 (Drive)", body:"", drive:true }];
      }
    }
    if (!title) title = (chs[0] && chs[0].t && chs.length===1) ? "Truyện Drive "+fid.slice(0,8) : ("Truyện Drive "+fid.slice(0,8));
    const stories = LS.get("stories", DEMO_STORIES);
    const id = stories.length ? Math.max(...stories.map(s=>s.id))+1 : 1;
    const chapters = chs.map(c => ({
      n: c.n, t: c.t,
      body: (c.body||"").slice(0, 200000),
      drive: !(c.body||"").trim(),
    }));
    stories.push({
      id, title, genre, author, author_id: state.user.id,
      views:0, monthly:0, exclusive:false, potential:false, status:"published",
      drive_file_id: fid,
      chapters: chapters.length ? chapters : [{ n:1, t:"Chương 1", body:"", drive:true }],
    });
    LS.set("stories", stories);
    msg.className="msg ok";
    msg.textContent="Đã đăng #"+id+" — "+title+" (Drive "+fid+")";
    el.querySelector("#pd-link").value="";
    el.querySelector("#pd-title").value="";
    el._pdCache=null;
    renderPublishDrive(document.getElementById("app"));
  };
}

    <div class="page">
      <div class="form-card" style="max-width:480px">
        <div style="text-align:center;margin-bottom:12px">
          <div class="av" style="width:64px;height:64px;margin:0 auto 8px;font-size:28px">👤</div>
          <h2>${esc(u.display_name||u.email)}</h2>
          <span class="rank-badge ${getUserRank(u)}">${getUserRank(u)==="O2"?"O₂":getUserRank(u)}</span>
        </div>
        <div class="field"><label>Email</label><input value="${esc(u.email)}" disabled /></div>
        <div class="field"><label>Tên hiển thị</label><input id="acc-name" value="${esc(u.display_name||"")}" /></div>
        <div class="field"><label>Tiểu sử</label><textarea id="acc-bio">${esc(u.bio||"")}</textarea></div>
        <div class="toolbar">
          <button class="btn btn-primary" id="btn-save-acc">Lưu</button>
          <button class="btn btn-danger" id="btn-logout">Đăng xuất</button>
        </div>
        <p class="tip" style="margin-top:12px">Viết nội dung tay & xuất ebook: dùng <b>app EXE</b>. Admin (O/O₂) có thể <b>Đăng Drive</b> trên web (chỉ dán link).</p>
      </div>
    </div>`;
  el.querySelector("#btn-save-acc").onclick = () => {
    const users = LS.get("users",[]);
    const idx = users.findIndex(x => x.id === u.id);
    if (idx>=0) {
      users[idx].display_name = el.querySelector("#acc-name").value.trim() || users[idx].display_name;
      users[idx].bio = el.querySelector("#acc-bio").value;
      LS.set("users", users);
      state.user = { ...users[idx] };
      updateHeaderChip();
      alert("Đã lưu.");
    }
  };
  el.querySelector("#btn-logout").onclick = () => {
    state.user = null;
    state.page = "login";
    updateHeaderChip();
    buildNav();
    renderPage();
  };
}

function openStory(sid) {
  const stories = LS.get("stories", DEMO_STORIES);
  const s = stories.find(x => x.id === sid);
  if (!s) return;
  s.views = (s.views||0) + 1;
  LS.set("stories", stories);
  const bg = document.getElementById("modal-bg");
  const body = document.getElementById("modal-body");
  const fid = s.drive_file_id || "";
  body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:start;gap:12px">
      <div>
        <h2>${esc(s.title)}</h2>
        <div class="meta">${esc(s.author||"")} · ${esc(s.genre||"")} · ${formatViews(s.views)} views
          ${s.exclusive?" · ★ Độc quyền":""}
          ${fid?" · ☁ Drive":""}</div>
      </div>
      <button class="btn" id="modal-close">Đóng</button>
    </div>
    <div class="toolbar">
      <button class="btn" id="btn-like">♥ Like</button>
      ${fid ? `<a class="btn btn-primary" href="${esc(driveViewUrl(fid))}" target="_blank" rel="noopener">☁ Mở file Drive</a>` : ""}
      ${fid ? `<button class="btn" id="btn-try-drive">Thử tải mục lục từ Drive</button>` : ""}
    </div>
    <h3 style="font-size:14px;margin:12px 0 8px">Danh sách chương</h3>
    <ul class="chapter-list" id="ch-list">
      ${(s.chapters||[]).map(c => {
        const needDrive = c.drive || (!(c.body||"").trim() && fid);
        return `<li data-ch="${c.n}" data-drive="${needDrive?1:0}">
          <span>Ch. ${c.n}: ${esc(c.t||"")}</span>
          <span style="color:var(--muted);font-size:12px">${needDrive?"☁ Drive":"Đọc"}</span>
        </li>`;
      }).join("") || "<li>Chưa có chương</li>"}
    </ul>
    <div id="ch-content" class="reader-body" style="display:none"></div>
    <p class="tip" id="ch-tip"></p>
  `;
  bg.classList.remove("hidden");
  body.querySelector("#modal-close").onclick = () => bg.classList.add("hidden");
  bg.onclick = (e) => { if (e.target === bg) bg.classList.add("hidden"); };

  const box = body.querySelector("#ch-content");
  const tip = body.querySelector("#ch-tip");

  body.querySelectorAll("[data-ch]").forEach(li => {
    li.onclick = async () => {
      const ch = (s.chapters||[]).find(c => c.n === +li.dataset.ch);
      box.style.display = "block";
      if (ch && (ch.body||"").trim()) {
        box.textContent = ch.body;
        tip.textContent = "";
        return;
      }
      if (fid) {
        box.textContent = "Chương lưu trên Google Drive (public link).\n\nTrình duyệt thường bị CORS khi tải file Drive trực tiếp — hãy bấm «Mở file Drive» hoặc mở link bên dưới.";
        tip.innerHTML = `<a href="${esc(driveViewUrl(fid))}" target="_blank" rel="noopener">Mở Drive · file ${esc(extractDriveFileId(fid))}</a>`;
        return;
      }
      box.textContent = "(Chưa có nội dung chương — đăng / gắn Drive từ app)";
      tip.textContent = "";
    };
  });

  const tryBtn = body.querySelector("#btn-try-drive");
  if (tryBtn) tryBtn.onclick = async () => {
    tip.textContent = "Đang thử tải…";
    box.style.display = "block";
    try {
      const text = await tryFetchDriveText(fid);
      const parsed = parseChaptersFromText(text);
      if (parsed.length) {
        s.chapters = parsed.map(c => ({ n:c.n, t:c.t, body:c.body, drive:false }));
        LS.set("stories", stories);
        box.textContent = "Đã tải và tách "+parsed.length+" chương từ Drive (cache local trình duyệt). Chọn chương để đọc.";
        tip.textContent = "";
        // refresh list
        openStory(sid);
      } else {
        box.textContent = text.slice(0, 8000);
        tip.textContent = "Không tách được header chương — hiện raw text.";
      }
    } catch (e) {
      box.textContent = "Không tải được trong trình duyệt.\n" + (e && e.message ? e.message : e);
      tip.innerHTML = `Cách chắc chắn: <a href="${esc(driveViewUrl(fid))}" target="_blank" rel="noopener">mở link Drive public</a>. App desktop tải được vì không bị CORS.`;
    }
  };
}

function enterApp(user) {
  state.user = user;
  const cfg = getConfig();
  if (cfg.welcome_enabled && cfg.welcome_message) {
    const flag = "wel_"+user.id;
    if (!LS.get(flag)) {
      LS.set(flag, true);
      setTimeout(() => alert("[Chào mừng]\n"+cfg.welcome_message), 400);
    }
  }
  document.getElementById("splash").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  updateHeaderChip();
  applyTheme(getConfig().theme || "dark");
  goto("home");
}

seedIfNeeded();
document.getElementById("btn-enter-splash").onclick = () => {
  document.getElementById("splash").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  state.page = "login";
  applyTheme(getConfig().theme || "dark");
  updateHeaderChip();
  document.getElementById("nav").innerHTML = "";
  renderPage();
};
document.getElementById("btn-theme").onclick = () => {
  applyTheme(state.theme === "dark" ? "light" : "dark");
};
document.getElementById("logo-btn").onclick = document.getElementById("brand-btn").onclick = () => {
  if (state.user) goto("home");
  else goto("home");
};
applyTheme(getConfig().theme || "dark");
</script>
</body>
</html>
